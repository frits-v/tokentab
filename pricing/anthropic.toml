# Plans. Seat prices are per seat per month. Anthropic publishes included usage as
# ratios only: Pro is at least 5x Free, Max is 5x or 20x Pro, a Premium seat is 5x a
# Standard seat. `allowance_anchor_usd` is the single assumption that turns those
# ratios into dollars: the API-equivalent usage one Pro seat gets in a month. Every
# plan's allowance is `allowance_anchor_usd * allowance_multiple`. The report prints
# the same numbers with the anchor halved and doubled.
#
# API credits (added October 2026) are monthly Claude Platform credits bundled with
# Max and Team. They cover the API, the Agent SDK and headless `claude -p` runs, not
# interactive Claude Code, so the estimate applies them to SDK-entrypoint usage only.

[plans]
allowance_anchor_usd = 60.0

[[plans.plan]]
id = "api"
name = "API pay-as-you-go"
kind = "pay_as_you_go"
min_seats = 1
allowance_multiple = 0.0
api_credits_per_seat_usd = 0.0
extra_usage_at_api_rates = true

[[plans.plan]]
id = "pro"
name = "Pro"
kind = "subscription"
seat_monthly_usd = 20.0
seat_annual_usd = 17.0
min_seats = 1
max_seats = 1
allowance_multiple = 1.0
api_credits_per_seat_usd = 0.0
extra_usage_at_api_rates = true

[[plans.plan]]
id = "max5"
name = "Max 5x"
kind = "subscription"
seat_monthly_usd = 100.0
min_seats = 1
max_seats = 1
allowance_multiple = 5.0
api_credits_per_seat_usd = 100.0
extra_usage_at_api_rates = true

[[plans.plan]]
