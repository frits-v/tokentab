# Anthropic price list and plan catalog. Dollars per million tokens.
# Source: https://platform.claude.com/docs/en/about-claude/pricing and https://claude.com/pricing
as_of = "2026-10-28"

# Claude 4.6 and later bill the full 1M context at one rate. Haiku 5.5 is the exception:
# a request whose prompt (input + cache reads + cache writes) exceeds 100,000 tokens pays
# the second tier for the whole request.

